# docker-compose.yml
# วางไฟล์นี้ไว้ใน backend/ โดยตรง (ระดับเดียวกับ Dockerfile)
# แล้ว commit ขึ้น GitHub repo hospitalback-end
#
# ===== วิธีใช้บนเครื่องใหม่ =====
#
# 1. ติดตั้ง Docker Desktop + Git
#
# 2. ดึงโค้ดจาก GitHub:
#      git clone https://github.com/famozy3508-gif/hospitalback-end.git
#      cd hospitalback-end
#
# 3. เตรียมข้อมูลเริ่มต้น (ถ้าต้องการให้มีข้อมูลเดิม):
#      mkdir init-db
#      เอาไฟล์ hospital_db_backup.sql ไปวางในโฟลเดอร์ init-db
#
# 4. เอาไฟล์ config/mail_config.php จาก backup มาวาง
#    (ไฟล์นี้ไม่มีบน GitHub เพราะมีรหัสผ่าน)
#
# 5. รัน:
#      docker compose up -d
#
# 6. เปิดใช้งาน:
#      http://localhost:8080/api/auth/me.php   (backend)
#      http://localhost:8081                   (phpMyAdmin)
#
# 7. หยุดใช้งาน:
#      docker compose down

services:

  # ---------- ฐานข้อมูล MySQL (แทน MySQL ของ XAMPP) ----------
  db:
    image: mysql:8
    container_name: hospital-db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hospital_db
    ports:
      # ใช้ 3307 กันชนกับ MySQL ตัวอื่นในเครื่อง ถ้ามี
      - "3307:3306"
    volumes:
      # เก็บข้อมูลถาวร ไม่หายตอน docker compose down
      - dbdata:/var/lib/mysql
      # ไฟล์ .sql ในโฟลเดอร์นี้จะถูก import อัตโนมัติตอนสร้าง container ครั้งแรกเท่านั้น
      - ./init-db:/docker-entrypoint-initdb.d

  # ---------- Backend PHP + Apache (แทน Apache ของ XAMPP) ----------
  backend:
    build: .
    container_name: hospital-backend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # ชี้ไปที่ container ชื่อ db ข้างบน (ไม่ใช่ 127.0.0.1)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: hospital_db
      DB_USER: root
      DB_PASSWORD: ""
      # --- ถ้าจะทดสอบส่งอีเมลในเครื่อง ใส่ค่าตรงนี้ ---
      # BREVO_API_KEY: ""
      # SMTP_USERNAME: ""
      # SMTP_FROM_NAME: "ระบบห้องพยาบาล USP"
      # --- ถ้าจะทดสอบอัปโหลดรูปในเครื่อง ใส่ค่าตรงนี้ ---
      # CLOUDINARY_CLOUD_NAME: ""
      # CLOUDINARY_API_KEY: ""
      # CLOUDINARY_API_SECRET: ""
    volumes:
      # แก้ไฟล์ PHP ในเครื่องแล้วเห็นผลทันที ไม่ต้อง build ใหม่
      - .:/var/www/html
    depends_on:
      - db

  # ---------- phpMyAdmin (แทน phpMyAdmin ของ XAMPP) ----------
  phpmyadmin:
    image: phpmyadmin
    container_name: hospital-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ""
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  dbdata:
